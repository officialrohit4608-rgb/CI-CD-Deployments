# Runs when code is merged (pushed) into main.
# Actually deploys the code to the PROD org.
name: Deploy to PROD

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also lets you start it by hand from the Actions tab

# Never run two deployments to the same org at once
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Log in to Target org (JWT)
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url https://login.salesforce.com \
            --alias prod
          rm server.key


      - name: Deploy + run Apex tests
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org prod \
            --test-level RunLocalTests \
            --wait 30
