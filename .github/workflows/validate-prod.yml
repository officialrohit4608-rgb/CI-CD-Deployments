# Runs on every Pull Request into main.
# Checks that the change WOULD deploy to the PROD org and that all tests pass,
# without actually changing anything (--dry-run).
name: Validate against PROD

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Log in to Target org (JWT)
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id "${{ secrets.SF_CONSUMER_KEY }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SF_USERNAME }}" \
            --instance-url https://login.salesforce.com \
            --alias prod
          rm server.key


      - name: Validate deployment + run Apex tests (no changes made)
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org prod \
            --dry-run \
            --test-level RunLocalTests \
            --wait 30
